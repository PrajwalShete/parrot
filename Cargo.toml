[package]
name = "parrot"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Live meeting transcription and a voice assistant for your notes, in your browser."
repository = "https://github.com/PrajwalShete/parrot"
readme = "README.md"
keywords = ["transcription", "gemini", "meetings", "voice", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
mime_guess = "2.0.5"
notify = "8"
open = "5.4.4"
regex = "1.13.1"
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util", "process", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target."cfg(unix)".dependencies]
libc = "0.2.190"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
