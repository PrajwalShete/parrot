# Pushing a version tag (v1.2.3) builds Parrot for macOS (Apple Silicon and Intel) and Linux
# (x86-64 and ARM64, static musl builds that run on any distribution) and publishes them with
# .sha256 files to a GitHub release. install.sh downloads from there.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund && npm test && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist

  build:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: parrot-darwin-arm64 }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: parrot-darwin-x64 }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: parrot-linux-x64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: parrot-linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        # Every target runs on its runner (x86_64 macOS through Rosetta).
        run: target/${{ matrix.target }}/release/parrot --version
      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/parrot ${{ matrix.asset }}
          shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: parrot-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" parrot-* install.sh --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
